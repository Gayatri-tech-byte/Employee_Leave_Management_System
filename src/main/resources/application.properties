# ─────────────────────────────────────────────
#  Employee Leave Management System
#  application.properties
# ─────────────────────────────────────────────

# ── Server ──────────────────────────────────
server.port=8080

# ── MySQL DataSource ─────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/leave_management_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA / Hibernate ──────────────────────────
# 'update' creates tables on first run and applies safe schema changes.
# Switch to 'validate' or 'none' in production.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ── Jackson (JSON serialisation) ─────────────
# Serialize LocalDate as "2024-08-10" string instead of array
spring.jackson.serialization.write-dates-as-timestamps=false

# ── Logging ──────────────────────────────────
logging.level.com.example.leave_management=DEBUG
